name: Python service

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/pricing-service
        run: pip install -r requirements-dev.txt
      - name: Tests
        working-directory: apps/pricing-service
        run: python -m pytest
      - name: Docker image
        run: docker build -t pricing-service apps/pricing-service
